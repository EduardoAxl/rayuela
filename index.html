<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rayuela: Érase una vez... en los '10</title>

<style>

body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
    text-align:center;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.container{
    max-width:700px;
    padding:30px 20px;
}

.cover{
    width:100%;
    max-width:500px;
    border-radius:12px;
    margin-bottom:20px;
}

h1{
    font-size:4rem;
    margin:0;
}

.subtitle{
    font-size:1.2rem;
    opacity:.7;
    margin:10px 0 40px;
}

button{
    background:#fff;
    color:#000;
    border:none;
    border-radius:10px;
    padding:15px 30px;
    font-size:18px;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    transform:scale(1.05);
}

.mensaje{
    margin:30px 0;
    font-size:1.4rem;
    opacity:.85;
}

.final-message{
    margin-top:40px;
    font-size:1.4rem;
}

iframe{
    width:100%;
    max-width:560px;
    height:315px;
    border:none;
    border-radius:12px;
    margin-top:20px;
}

/* RAYUELA */

.rayuela{
    margin:40px auto;
    max-width:220px;
}

.fila{
    display:flex;
    margin-bottom:12px;
}

.fila.centro{
    justify-content:center;
}

.fila.doble{
    justify-content:center;
    gap:12px;
}

.casilla-ui{
    width:80px;
    height:80px;
    border:2px solid rgba(255,255,255,.2);
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    color:rgba(255,255,255,.8);
    transition:.3s;
}

.casilla-activa{
    border-color:#fff;
    color:#fff;
    box-shadow:0 0 25px rgba(255,255,255,.5);
    transform:scale(1.1);
}

.vacio{
    width:80px;
    height:80px;
}

</style>
</head>

<body>

<div class="container">

    <img class="cover"
    src="file_000000007f6c720ebbfa9d65d93e6e65.png"
    alt="Rayuela">

    <h1>Rayuela</h1>

    <div class="subtitle">
        Érase una vez... en los '10
    </div>

    <div id="contenido">
        <button onclick="elegirCancion()">
            ✨ Saltar la rayuela
        </button>
    </div>

</div>

<script src="canciones.js"></script>

<script>

function generarRayuela(casillaActiva){

return `
<div class="rayuela">

    <div class="fila centro">
        <div class="casilla-ui ${casillaActiva===8 ? 'casilla-activa' : ''}">8</div>
    </div>

    <div class="fila doble">
        <div class="casilla-ui ${casillaActiva===6 ? 'casilla-activa' : ''}">6</div>
        <div class="casilla-ui ${casillaActiva===7 ? 'casilla-activa' : ''}">7</div>
    </div>

    <div class="fila centro">
        <div class="casilla-ui ${casillaActiva===5 ? 'casilla-activa' : ''}">5</div>
    </div>

    <div class="fila doble">
        <div class="casilla-ui ${casillaActiva===3 ? 'casilla-activa' : ''}">3</div>
        <div class="casilla-ui ${casillaActiva===4 ? 'casilla-activa' : ''}">4</div>
    </div>

    <div class="fila centro">
        <div class="casilla-ui ${casillaActiva===2 ? 'casilla-activa' : ''}">2</div>
    </div>

    <div class="fila centro">
        <div class="casilla-ui ${casillaActiva===1 ? 'casilla-activa' : ''}">1</div>
    </div>

</div>
`;
}

function mostrarCancion(cancion){

document.getElementById("contenido").innerHTML = `
<div class="mensaje">
Te detuviste en la casilla <b>${cancion.casilla}</b>.
</div>

${generarRayuela(cancion.casilla)}

<iframe
src="${cancion.video}"
allowfullscreen>
</iframe>
`;
}

function mostrarFin(){

document.getElementById("contenido").innerHTML = `
<div class="final-message">
    <h2>La rayuela ya fue jugada.</h2>
    <p>Solo se vive una vez esta historia.</p>
</div>
`;
}

function elegirCancion(){

if (!window.canciones || canciones.length === 0) {
    document.getElementById("contenido").innerHTML = `
        <div class="mensaje">
            No hay canciones disponibles 😢
        </div>
    `;
    return;
}

const guardada = localStorage.getItem("rayuela_cancion");

if(guardada){
    mostrarCancion(JSON.parse(guardada));
    return;
}

const aleatoria = canciones[Math.floor(Math.random()*canciones.length)];

localStorage.setItem("rayuela_cancion", JSON.stringify(aleatoria));

mostrarCancion(aleatoria);
}

window.onload = () => {

const guardada = localStorage.getItem("rayuela_cancion");

if(guardada){
    mostrarFin();
}

};

</script>

</body>
</html>
