<!DOCTYPE html><html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Rayuela: Érase una vez... en los '10</title><style>

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial, sans-serif;
    text-align:center;
}

.container{
    max-width:700px;
    margin:auto;
    padding:30px 20px;
}

.cover{
    width:100%;
    max-width:500px;
    border-radius:12px;
    box-shadow:0 0 25px rgba(255,255,255,.1);
}

h1{
    margin-top:20px;
    margin-bottom:5px;
    font-size:2.8rem;
}

.subtitle{
    opacity:.7;
    margin-bottom:30px;
}

button{
    padding:15px 30px;
    font-size:18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.rayuela{
    margin:30px auto;
    width:120px;
}

.casilla-ui{
    width:60px;
    height:60px;
    border:2px solid rgba(255,255,255,.3);
    margin:6px auto;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:8px;
    opacity:.6;
}

.casilla-activa{
    border-color:white;
    opacity:1;
    box-shadow:0 0 15px rgba(255,255,255,.4);
}

iframe{
    width:100%;
    max-width:560px;
    height:315px;
    border:none;
    margin-top:20px;
}

.mensaje{
    margin-top:20px;
    opacity:.8;
}

.final-message{
    margin-top:40px;
    opacity:.8;
}

</style></head><body><div class="container"><img
class="cover"
src="rayuela-cover.jpg"
alt="Rayuela">

<h1>Rayuela</h1><div class="subtitle">
Érase una vez... en los '10
</div><div id="contenido"><button onclick="elegirCancion()">
✨ Saltar la rayuela
</button></div></div><script src="canciones.js"></script><script>

function generarRayuela(casillaActiva){

let html = '<div class="rayuela">';

for(let i=1;i<=8;i++){

html += `
<div class="
casilla-ui
${i===casillaActiva ? 'casilla-activa' : ''}
">
${i}
</div>
`;

}

html += '</div>';

return html;

}

function mostrarCancion(cancion){

document.getElementById("contenido").innerHTML = `

<div class="mensaje">
Te detuviste en la casilla ${cancion.casilla}.
</div>

${generarRayuela(cancion.casilla)}

<iframe
src="${cancion.video}"
allowfullscreen>
</iframe>

`;

}

function mostrarFin(){

document.getElementById("contenido").innerHTML = `

<div class="final-message">
<h2>La rayuela ya fue jugada.</h2>
</div>

`;

}

function elegirCancion(){

const guardada =
localStorage.getItem("rayuela_cancion");

if(guardada){

mostrarCancion(
JSON.parse(guardada)
);

return;

}

const aleatoria =
canciones[
Math.floor(
Math.random()*canciones.length
)
];

localStorage.setItem(
"rayuela_cancion",
JSON.stringify(aleatoria)
);

mostrarCancion(aleatoria);

}

window.onload = () => {

const guardada =
localStorage.getItem("rayuela_cancion");

if(guardada){
mostrarFin();
}

};

</script></body>
</html>
